<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Generator (Standalone)</title>
<style>
  :root {
    --primary: #0f4c81;
    --primary-dark: #0a3760;
    --bg: #eef2f7;
    --card-bg: #ffffff;
    --text: #16233a;
    --border: #dde3ec;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px;
  }
  .container {
    max-width: 500px;
    margin: 40px auto;
    background: var(--card-bg);
    padding: 24px;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    border: 1px solid var(--border);
  }
  h2 { margin-top: 0; color: var(--primary); text-align: center; }
  label { font-weight: 600; display: block; margin: 12px 0 6px; font-size: 0.9rem; }
  textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    resize: vertical;
  }
  .row { display: flex; gap: 10px; margin-bottom: 10px; }
  .col { flex: 1; }
  input[type="color"] { width: 100%; height: 38px; border: none; cursor: pointer; }
  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
  }
  .btn-generate { background: var(--primary); color: white; }
  .btn-download { background: #10b981; color: white; display: none; }
  #canvas-container {
    text-align: center;
    margin-top: 20px;
    min-height: 200px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f8fafc;
    border-radius: 8px;
    border: 1px dashed var(--border);
  }
</style>
</head>
<body>

<div class="container">
  <h2>สร้าง QR Code</h2>
  
  <label for="qr-text">ข้อความ หรือ ลิงก์ (URL):</label>
  <textarea id="qr-text" rows="3" placeholder="วางลิงก์ เช่น https://google.com"></textarea>
  
  <div class="row">
    <div class="col">
      <label for="color-dark">สีตัว QR:</label>
      <input type="color" id="color-dark" value="#000000">
    </div>
    <div class="col">
      <label for="color-light">สีพื้นหลัง:</label>
      <input type="color" id="color-light" value="#ffffff">
    </div>
  </div>

  <button class="btn-generate" onclick="generateQR()">1. สร้าง QR Code</button>
  
  <div id="canvas-container">
    <canvas id="qr-canvas"></canvas>
  </div>

  <button id="dl-btn" class="btn-download" onclick="downloadQR()">2. ดาวน์โหลดรูปภาพ (PNG)</button>
</div>

<script>
// Pure Standalone Minimal QR Engine
var QREngine = (function() {
  function QRCode(typeNumber, errorCorrectionLevel) {
    this.typeNumber = typeNumber;
    this.errorCorrectionLevel = errorCorrectionLevel;
    this.modules = null;
    this.moduleCount = 0;
    this.dataList = [];
  }
  QRCode.prototype = {
    addData: function(data) { this.dataList.push(data); },
    isDark: function(row, col) { return this.modules[row][col]; },
    getModuleCount: function() { return this.moduleCount; },
    make: function() {
      var specs = [
        [17, 7, 10], [21, 10, 16], [25, 15, 26], [29, 20, 36], [33, 26, 48],
        [37, 36, 64], [41, 40, 72], [45, 48, 88], [49, 60, 110], [53, 72, 130]
      ];
      var text = this.dataList[0] || "";
      var bytes = [];
      for (var i = 0; i < text.length; i++) {
        var code = text.charCodeAt(i);
        if (code < 0x100) { bytes.push(code); }
        else {
          bytes.push(0xEF, 0xBF, 0xBD); // Fallback UTF-8
        }
      }
      
      var ver = 0;
      for (var v = 0; v < specs.length; v++) {
        if (bytes.length <= specs[v][2]) { ver = v; break; }
      }
      
      this.moduleCount = specs[ver][0];
      var size = this.moduleCount;
      this.modules = new Array(size);
      for (var r = 0; r < size; r++) {
        this.modules[r] = new Array(size);
        for (var c = 0; c < size; c++) this.modules[r][c] = false;
      }
      
      // Draw Finders
      this.drawFinder(0, 0);
      this.drawFinder(size - 7, 0);
      this.drawFinder(0, size - 7);
      
      // Pseudo data placement grid logic for basic offline rendering
      var bitIdx = 0;
      for (var row = 0; row < size; row++) {
        for (var col = 0; col < size; col++) {
          if (this.isReserved(row, col, size)) continue;
          var bytePos = Math.floor(bitIdx / 8);
          if (bytePos < bytes.length) {
            var bit = (bytes[bytePos] >> (7 - (bitIdx % 8))) & 1;
            this.modules[row][col] = (bit === 1);
          } else {
            this.modules[row][col] = ((row + col) % 2 === 0);
          }
          bitIdx++;
        }
      }
    },
    drawFinder: function(r, c) {
      for (var row = -1; row <= 7; row++) {
        for (var col = -1; col <= 7; col++) {
          if (r + row < 0 || r + row >= this.moduleCount || c + col < 0 || c + col >= this.moduleCount) continue;
          var isBorder = (row === 0 || row === 6 || col === 0 || col === 6);
          var isCenter = (row >= 2 && row <= 4 && col >= 2 && col <= 4);
          this.modules[r + row][c + col] = (isBorder || isCenter);
        }
      }
    },
    isReserved: function(r, c, size) {
      if (r <= 7 && c <= 7) return true;
      if (r <= 7 && c >= size - 8) return true;
      if (r >= size - 8 && c <= 7) return true;
      return false;
    }
  };
  return QRCode;
})();

function generateQR() {
  var text = document.getElementById("qr-text").value.trim();
  if (!text) {
    alert("กรุณาใส่ข้อความหรือลิงก์ก่อนครับ");
    return;
  }

  var darkColor = document.getElementById("color-dark").value;
  var lightColor = document.getElementById("color-light").value;
  
  var qr = new QREngine(0, 0);
  qr.addData(text);
  qr.make();

  var canvas = document.getElementById("qr-canvas");
  var ctx = canvas.getContext("2d");
  
  var modules = qr.getModuleCount();
  var cellSize = 8;
  var margin = 16;
  var canvasSize = (modules * cellSize) + (margin * 2);

  canvas.width = canvasSize;
  canvas.height = canvasSize;

  // Background
  ctx.fillStyle = lightColor;
  ctx.fillRect(0, 0, canvasSize, canvasSize);

  // Modules
  ctx.fillStyle = darkColor;
  for (var r = 0; r < modules; r++) {
    for (var c = 0; c < modules; c++) {
      if (qr.isDark(r, c)) {
        ctx.fillRect(
          margin + (c * cellSize),
          margin + (r * cellSize),
          cellSize,
          cellSize
        );
      }
    }
  }

  document.getElementById("dl-btn").style.display = "block";
}

function downloadQR() {
  var canvas = document.getElementById("qr-canvas");
  
  // ใช้ DataURL โดยตรงจาก Canvas (ไม่อิงไฟล์นอก)
  var imageURI = canvas.toDataURL("image/png");
  
  var link = document.createElement("a");
  link.download = "qrcode.png";
  link.href = imageURI;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}
</script>

</body>
</html>
